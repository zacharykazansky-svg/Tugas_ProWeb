<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Sederhana</title>
    <link rel="stylesheet" href="kalkulator.css">
</head>

<body>
    <fieldset>
        <form action="">
        <label for="bil1">Input Bilangan 1</label>
        <input type="number" name="Bilangan 1" id="bil1"><br>
        <label for="bil2">Input Bilangan 2</label>
        <input type="number" name="Bilangan 2" id="bil2"><br>
        <div class="button">
            <input type="submit" value="+" onclick="hitung('+');return false;">
            <input type="submit" value="-" onclick="hitung('-');return false;">
            <input type="submit" value="x" onclick="hitung('*');return false;">
            <input type="submit" value="/" onclick="hitung('/');return false;">
        </div>
        <div class="hasil">
        <label for="hasil">Output</label>
        <input id="output" type="text">
        </div>
        </form>
    </fieldset>
    <script src="kalkulator.js" type="text/javascript"></script>
</body>

</html>
